
<h2>Banner <button id="replay-banner">Replay</button></h2>

<div class="row">
  <div class="card">
    <span class="tag">banner-dark.v1.svg (dark)</span>
    <img
      class="banner"
      data-base="assets/banner-dark.v1.svg"
      src="assets/banner-dark.v1.svg"
      width="880"
      alt="Dark GitHub profile banner"
      onerror="this.replaceWith(Object.assign(document.createElement('p'), {
        className: 'missing',
        textContent: 'Banner not generated yet — run scripts/banner/generate.py'
      }))"
    >
  </div>

  <div class="card light">
    <span class="tag" style="color:#57606a">banner-light.v1.svg (light)</span>
    <img
      class="banner"
      data-base="assets/banner-light.v1.svg"
      src="assets/banner-light.v1.svg"
      width="880"
      alt="Light GitHub profile banner"
      onerror="this.replaceWith(Object.assign(document.createElement('p'), {
        className: 'missing',
        textContent: 'Banner not generated yet'
      }))"
    >
  </div>
</div>
