<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200">
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#050505"/>
      <stop offset="0.5" stop-color="#241900"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="gold">
      <stop stop-color="#80621B"/>
      <stop offset=".5" stop-color="#FFF0B0"/>
      <stop offset="1" stop-color="#C9A227"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1000" height="200" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="996" height="196" rx="14" fill="none" stroke="#C9A227" stroke-opacity=".7"/>
  <g stroke="#C9A227" stroke-opacity=".12">
    <path d="M0 40H1000 M0 80H1000 M0 120H1000 M0 160H1000"/>
    <path d="M100 0V200 M200 0V200 M300 0V200 M400 0V200 M500 0V200 M600 0V200 M700 0V200 M800 0V200 M900 0V200"/>
  </g>
  <g fill="#FFD76A" filter="url(#glow)">
    <circle cx="100" cy="45" r="3"><animate attributeName="opacity" values=".1;1;.1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="150" r="2"><animate attributeName="opacity" values="1;.1;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="35" r="3"><animate attributeName="opacity" values=".1;1;.1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="155" r="3"><animate attributeName="opacity" values="1;.1;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="45" r="3"><animate attributeName="opacity" values=".1;1;.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="135" r="2"><animate attributeName="opacity" values="1;.1;1" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>
  <path d="M0 110 Q250 20 500 110 T1000 110" fill="none" stroke="url(#gold)" stroke-width="2" filter="url(#glow)">
    <animate attributeName="d" dur="5s" repeatCount="indefinite" values="M0 110 Q250 20 500 110 T1000 110;M0 110 Q250 190 500 110 T1000 110;M0 110 Q250 20 500 110 T1000 110"/>
  </path>
  <text x="500" y="88" text-anchor="middle" font-family="monospace" font-size="34" letter-spacing="7" fill="#FFF0B0" filter="url(#glow)">GOLDEN NEXUS</text>
  <text x="500" y="120" text-anchor="middle" font-family="monospace" font-size="13" letter-spacing="4" fill="#C9A227">BUILD • LEARN • REPEAT</text>
  <rect x="390" y="145" width="220" height="2" fill="#FFD76A">
    <animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
